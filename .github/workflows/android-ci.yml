name: reusable-android-ci
on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '21'
      gradle-command:
        type: string
        default: './gradlew test lint assembleDebug'
      runner:
        type: string
        default: '["self-hosted","Linux","X64","build"]'
permissions:
  contents: read
jobs:
  android:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: gradle
      - name: Gradle checks
        run: ${{ inputs.gradle-command }}
