name: reusable-apple-xcode-ci
on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: 'macos-15'
      xcode-command:
        type: string
        required: true
permissions:
  contents: read
jobs:
  xcode:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Xcode build and test
        shell: bash
        run: ${{ inputs.xcode-command }}
