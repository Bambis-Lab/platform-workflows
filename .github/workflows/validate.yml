name: validate-workflow-library
on:
  push:
    branches: ['foundation/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate reusable workflow policy
        run: python3 scripts/validate_workflows.py
